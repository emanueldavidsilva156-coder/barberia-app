# Copia completa de la base de datos, todas las noches.
#
# Este archivo va en un repositorio PRIVADO aparte (por ejemplo
# "radikal-backups"), en la carpeta .github/workflows/. NO va en el repositorio
# de la app, que es público.
#
# Cada noche guarda la base completa (usuarios, tablas, reglas y datos) en la
# carpeta backup/. Git conserva cada día como una versión distinta, así que se
# puede volver a cualquier fecha. Nada se borra.
#
# Secreto necesario (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL  cadena de conexión "Session pooler" de Supabase (ver README)

name: Backup diario de la base

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC = 03:00 en Córdoba
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio de backups
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Exportar la base completa
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Falta el secreto SUPABASE_DB_URL"; exit 1; }
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only
          # Si algún archivo quedó vacío, el backup falla y GitHub manda un mail de aviso.
          test -s backup/schema.sql
          test -s backup/data.sql
          grep -Eq 'public"?\."?sales' backup/data.sql
          TZ=America/Argentina/Cordoba date '+%Y-%m-%d %H:%M' > backup/fecha.txt

      - name: Guardar la copia
        run: |
          git config user.name "backup-barberia"
          git config user.email "backup-barberia@users.noreply.github.com"
          git add backup
          if git diff --cached --quiet; then
            echo "La base no cambió desde el último backup."
            exit 0
          fi
          git commit -m "Backup $(TZ=America/Argentina/Cordoba date +%Y-%m-%d)"
          git push
